name: Sync HackTown 2026

# Syncs the 2026 schedule every 30 minutes and commits any real change.
# 2025 is an archived event and is intentionally NOT synced here.
# Disable or delete this workflow once HackTown 2026 is over.
#
# Tuned to stay fast, since this runs ~48x/day:
#   • No pip install — the 2026 (Supabase) provider is pure stdlib (urllib), and
#     provider_yazo (the only aiohttp user) is imported lazily, so `--year 2026`
#     never touches it. requirements.txt is still needed for 2025/local dev;
#     please don't "restore" a pip step here.
#   • No actions/setup-python — the runner image already ships Python 3.12 and
#     the sync only needs 3.9+ (zoneinfo).
#   • Sparse checkout — skips events/2025 (~3.4 MB of the ~5.2 MB tree), which
#     this job never reads.
on:
  schedule:
    # Every 30 minutes. GitHub may delay or drop scheduled runs under load, so
    # treat the cadence as "about every 30 min", not a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Let the job commit + push with the default GITHUB_TOKEN.
permissions:
  contents: write

# Never let two syncs run/commit at once.
concurrency:
  group: sync-2026
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Cone mode also includes every root-level file (the .py sync tool),
          # so this is just "everything except the other years' data".
          sparse-checkout: |
            config
            events/2026

      - name: Sync 2026 events
        run: python3 scrape_hacktown.py --year 2026

      - name: Commit & push if the event data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/2026

          # summary.json holds a timestamp that changes every run; only commit
          # when actual event/filter/location data changed, to avoid noise —
          # important at 48 runs a day.
          CHANGED="$(git diff --staged --name-only -- events/2026 | grep -v 'summary.json' || true)"
          if [ -z "$CHANGED" ]; then
            echo "No event-data changes — skipping commit."
          else
            echo "Changed files:"; echo "$CHANGED"
            git commit -m "Sync HackTown 2026 events ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # The branch may have moved on since checkout; rebase before pushing
            # so a run never fails on a stale ref.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
